# SonarQube Project Configuration
sonar.projectKey=studyconnect-backend
sonar.organization=studyconnect
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=StudyConnect Backend
sonar.projectVersion=0.0.1-SNAPSHOT

# Source Code Configuration
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=25
sonar.java.target=25

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/dto/**,**/entity/**,**/enums/**

# Test Exclusions
sonar.test.exclusions=**/bdd/**

# Coverage Reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Language
sonar.language=java
